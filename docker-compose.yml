services:
  db:
    image: postgres:15
    container_name: paperlock-db
    restart: always
    environment:
      POSTGRES_DB: paperlockDB
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: paperlock-app
    depends_on:
      - db
    ports:
      - "8082:8081"
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/paperlockDB
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}

volumes:
  postgres_data: